<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>실모단</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c3aed'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>실</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 로그인 화면 -->
  <section id="auth-view" class="auth" hidden>
    <div class="auth-card">
      <div class="brand brand-lg"><span class="brand-mark">실</span>실모단</div>
      <p class="auth-sub">실전 모의고사 기록을 한 곳에서</p>
      <div class="seg auth-tabs" role="tablist">
        <button type="button" class="seg-btn active" data-mode="login">로그인</button>
        <button type="button" class="seg-btn" data-mode="register">회원가입</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <label class="field">
          <span>아이디</span>
          <input name="username" required autocomplete="username" maxlength="20" />
        </label>
        <label class="field">
          <span>비밀번호</span>
          <input name="password" type="password" required autocomplete="current-password" maxlength="100" />
        </label>
        <p class="form-error" id="auth-error" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="auth-submit">로그인</button>
      </form>
    </div>
  </section>

  <!-- 메인 화면 -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><span class="brand-mark">실</span>실모단</div>
        <div class="topbar-right">
          <span class="username" id="username"></span>
          <button class="btn btn-ghost btn-sm" id="logout-btn">로그아웃</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <div class="seg subject-tabs" id="subject-tabs">
          <button type="button" class="seg-btn active" data-subject="korean">국어</button>
          <button type="button" class="seg-btn" data-subject="math">수학</button>
        </div>
        <button class="btn btn-primary" id="add-btn">+ 기록 추가</button>
      </div>

      <section class="stats" id="stats"></section>

      <section class="card">
        <div class="card-head">
          <h2>성적 변화</h2>
          <span class="muted small" id="chart-caption"></span>
        </div>
        <div class="chart-wrap">
          <canvas id="score-chart" aria-label="점수 변화 그래프" role="img"></canvas>
          <p class="empty" id="chart-empty" hidden>기록을 추가하면 그래프가 표시됩니다.</p>
        </div>
      </section>

      <div class="grid-2">
        <section class="card">
          <div class="card-head"><h2>비고 통계</h2></div>
          <div id="note-stats"></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>자주 틀린 문항</h2></div>
          <div id="wrong-stats"></div>
        </section>
      </div>

      <section class="card">
        <div class="card-head">
          <h2>전체 기록</h2>
          <span class="muted small">최근 시험이 위에 표시됩니다 · 날짜 모름 시험은 ▲▼로 순서를 바꿀 수 있어요</span>
        </div>
        <div class="table-wrap">
          <table class="records">
            <thead>
              <tr>
                <th>날짜</th>
                <th>학년도</th>
                <th>모의고사</th>
                <th>회차</th>
                <th class="num">점수</th>
                <th>틀린 문제</th>
                <th>비고</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
        </div>
        <p class="empty" id="records-empty" hidden>아직 기록이 없습니다. 첫 실모 기록을 추가해 보세요!</p>
      </section>
    </main>
  </div>

  <!-- 기록 입력 모달 -->
  <dialog id="exam-dialog">
    <form id="exam-form" method="dialog" novalidate>
      <div class="dialog-head">
        <h2 id="dialog-title">기록 추가</h2>
        <button type="button" class="icon-btn" id="dialog-close" aria-label="닫기">✕</button>
      </div>

      <div class="dialog-body">
        <div class="field">
          <span>과목</span>
          <div class="seg" id="form-subject">
            <button type="button" class="seg-btn" data-subject="korean">국어</button>
            <button type="button" class="seg-btn" data-subject="math">수학</button>
          </div>
        </div>

        <div class="row">
          <label class="field grow">
            <span>응시 날짜</span>
            <input type="date" name="examDate" id="f-date" />
          </label>
          <label class="check-inline">
            <input type="checkbox" id="f-date-unknown" /> 날짜 모름
          </label>
        </div>

        <div class="row">
          <label class="field">
            <span>학년도</span>
            <select name="schoolYear" id="f-year"></select>
          </label>
          <label class="field grow">
            <span>회차</span>
            <input name="round" id="f-round" maxlength="20" placeholder="예: 3회" />
          </label>
        </div>

        <label class="field">
          <span>모의고사 이름</span>
          <select id="f-name-select"></select>
        </label>
        <label class="field" id="f-name-custom-wrap" hidden>
          <span>직접 입력</span>
          <input id="f-name-custom" maxlength="50" placeholder="모의고사 이름을 입력하세요" />
        </label>

        <label class="field">
          <span>점수</span>
          <input type="number" name="score" id="f-score" min="0" max="100" step="1" inputmode="numeric" placeholder="0 ~ 100" />
        </label>

        <div class="field">
          <span>틀린 문제 <em class="muted" id="wrong-count"></em></span>
          <div class="qgrid" id="f-wrong"></div>
        </div>

        <div class="field">
          <span>비고 <em class="muted">(중복 선택 가능)</em></span>
          <div class="chips" id="f-notes"></div>
        </div>

        <p class="form-error" id="exam-error" hidden></p>
      </div>

      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" id="dialog-cancel">취소</button>
        <button type="submit" class="btn btn-primary" id="exam-submit">저장</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="/vendor/chart.umd.js"></script>
  <script src="/app.js"></script>
</body>
</html>
